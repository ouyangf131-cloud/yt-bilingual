<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
  <meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#111">
<title>双语字幕播放器</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="favicon.svg">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<main id="app">
  <header class="bar">
    <h1>双语字幕播放器</h1>
    <form id="loadForm" autocomplete="off" novalidate>
      <input id="urlInput" type="text" inputmode="url" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="粘贴 YouTube 链接" aria-label="粘贴 YouTube 链接">
      <button type="submit">加载</button>
    </form>
    <p id="msg" class="msg" role="status" hidden></p>
  </header>

  <section class="player-wrap" id="playerWrap"><div id="player"></div>
    <div id="playerErr" class="player-err" role="alert" hidden>
      <p id="playerErrMsg">视频加载失败：可能连不上 YouTube，请检查网络或 VPN 后刷新</p>
      <p id="playerErrDiag" class="diag"></p>
      <div class="err-actions">
        <button id="retryBtn" type="button">重试</button>
        <button id="plainBtn" type="button" class="secondary">简易播放器</button>
        <a id="openYt" class="ytlink" href="https://www.youtube.com/watch?v=ny26teC-4bU" target="_blank" rel="noopener">在 YouTube 打开</a>
      </div>
      <p class="hint">简易播放器和 YouTube App 中无法同步字幕，可在下方「字幕列表」对照阅读。</p>
    </div>
  </section>

  <section id="subs" class="subs" aria-live="polite">
    <p id="subZh" class="zh"></p>
    <p id="subEn" class="en"></p>
  </section>

  <section class="controls">
    <button id="tglZh" class="tgl on" aria-pressed="true">中文</button>
    <button id="tglEn" class="tgl on" aria-pressed="true">英文</button>
    <button id="tglList" class="tgl" aria-pressed="false">字幕列表</button>
  </section>
  <p id="status" class="status">正在加载…</p>

  <ol id="list" class="list" hidden></ol>

  <footer class="foot">
    提示：请在页面内播放（不要点全屏），全屏时 iPhone 无法显示双语字幕。点字幕列表中的句子可跳转。
  </footer>
</main>
<script src="js/cues.js"></script>
<script src="js/app.js"></script>
</body>
</html>
